<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playful Girl</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-head">
  <a class="back" href="/">← All Games</a>
  <div class="page-title">
    <h1 id="pageTitle">Loading…</h1>
    <span id="pageCat"></span>
  </div>
  <div style="flex:1"></div>
  <a class="logo" href="/"><span class="cube"></span>PLAYFUL<em>GIRL</em></a>
  <a id="acctChip" href="/account.html">👤 <span id="acctName">Sign in</span></a>
</div>

<div class="playwrap">
  <div class="stage">
    <canvas id="game" width="460" height="468"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <aside class="side">
    <div class="panel">
      <h4>LIVE</h4>
      <div class="statrow">
        <div class="stat"><small>SCORE</small><b class="acc" id="score">0</b></div>
        <div class="stat"><small>BEST</small><b id="best">—</b></div>
      </div>
      <input class="callsign" id="callsign" maxlength="12" placeholder="Your callsign (for the board)">
      <div style="margin-top:12px">
        <button class="btn btn-ghost" id="restartBtn" style="width:100%;justify-content:center">↻ RESTART RUN</button>
      </div>
    </div>
    <div class="panel about">
      <h4>ABOUT THIS GAME</h4>
      <p id="aboutDesc"></p>
      <ul class="controls-list" id="controlsList"></ul>
    </div>
    <div class="panel">
      <h4>SWEETHEART BOARD — TOP 5 💖</h4>
      <ol class="board" id="leaderboard"></ol>
    </div>
  </aside>
</div>

<script type="module" src="/js/player.js"></script>
</body>
</html>
